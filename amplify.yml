version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Temporary bootstrap: npm install also creates the lockfile in the build
        # environment. Commit package-lock.json and switch this back to npm ci.
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
